name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # The pre-edit skill check runs on every contributor's machine, so path, temp-directory,
    # and line-ending behaviour is verified on all three host platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structure checks
        run: node scripts/check.mjs
      # Quoted so Node expands the pattern itself: PowerShell does not glob for
      # native commands, so an unquoted pattern reaches Node literally on Windows.
      - name: Unit tests
        run: node --test "tests/*.test.mjs"

  java-examples:
    # Compile tests/examples for each release on that release's own JDK and run
    # them there, so every target is exercised on a matching runtime.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and run examples
        run: node scripts/check-examples.mjs --jdk "$JAVA_HOME" --release ${{ matrix.java }}
